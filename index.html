<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPPGOnline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="ippg-workspace">
  <div class="ippg-toolbar no-print">
    <button id="databaseBtn" type="button">Database</button>
    <label>Guide <select id="guideSelect"></select></label>
    <button id="printBtn" type="button">Print / Save PDF</button>
  </div>
  <aside id="databasePanel" class="ippg-db-panel no-print" hidden>
    <div class="ippg-db-head"><div><strong>Personaville Database</strong><span id="dbSource"></span></div><button id="dbClose" type="button">×</button></div>
    <div class="ippg-db-filters">
      <input id="dbSearch" type="search" placeholder="Search persona, rate card, pricing set, modifier...">
      <select id="dbLifecycle"><option value="">All lifecycle</option><option>Current</option><option>Scheduled</option></select>
      <select id="dbPricing"><option value="">All pricing sets</option></select>
    </div>
    <div id="dbCount" class="ippg-db-count"></div>
    <div id="dbRows" class="ippg-db-rows"></div>
  </aside>

  <article class="ippg-sheet" id="sheet">
    <header class="ippg-masthead">
      <h1 id="headline" class="ippg-headline"></h1>
      <img class="ippg-top-logo ippg-asset" data-asset="logo" alt="Sparklight">
      <div class="ippg-reasons" id="reasons"></div>
    </header>

    <section class="ippg-content">
      <div class="ippg-plans" id="plans"></div>
      <img class="ippg-dog ippg-asset" data-asset="dog" alt="">
    </section>

    <section class="ippg-offers">
      <img id="eeroPromo" class="ippg-eero ippg-asset" data-asset="eeroPromo"
           alt="Free eero Plus for 3 months when you choose a Gig plan.">
      <div id="mobilePromo" class="ippg-mobile-callout" aria-label="Get Unlimited Mobile FREE for 1 Year">
        <span class="ippg-mobile-plus">+</span><span>Get Unlimited Mobile </span><strong>FREE</strong><span> for 1 Year.</span>
        <span class="ippg-phone" aria-hidden="true"></span>
      </div>
    </section>

    <footer class="ippg-footer">
      <img class="ippg-footer-logo ippg-asset" data-asset="logo" alt="Sparklight">
      <div class="ippg-contact">Scan, call <strong>1.855.692.4116</strong><br>or visit <strong>Sparklight.com</strong></div>
      <img class="ippg-qr ippg-asset" data-asset="qr" alt="QR code">
      <div class="ippg-legal" id="legal"></div>
    </footer>
  </article>
</main>
<script src="app.js"></script>
</body>
</html>
