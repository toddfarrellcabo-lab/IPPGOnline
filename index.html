<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPPGOnline Print Master</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <div class="toolbar">
    <strong>IPPGOnline</strong>
    <label><input id="fiberToggle" type="checkbox"> Fiber</label>
    <label><input id="equipmentToggle" type="checkbox" checked> Equipment Included</label>
    <button id="printBtn" type="button">Save / Print PDF</button>
  </div>

  <main class="preview-stage">
    <div class="preview-scaler" id="previewScaler">
      <article class="page" id="ippgPage">
        <header class="header">
          <h1>Choose Your<br><span id="fiberWord">Fiber-Fueled</span> Speed.</h1>
          <div class="reasons">
            <span id="equipmentCopy" class="equipment">EQUIPMENT INCLUDED.</span>
            <span>UNLIMITED DATA. NO CONTRACTS. WI-FI POWERED BY EERO.</span>
          </div>
        </header>

        <section class="data-layer" id="dataLayer">
          <!-- IPPG speed, price, promo and legal modules render here next. -->
        </section>

        <img class="spark-art" src="assets/Spark_612x450.png" alt="">

        <footer class="footer">
          <img class="awfy-logo" src="assets/Sparklight(R)-purple-cmyk_AWFY.png"
               alt="Sparklight. Always working for you.">
          <div class="footer-right">
            <div class="footer-copy">
              <div>Scan, call 1.855.692.4116</div>
              <div>or visit Sparklight.com</div>
            </div>
            <img class="qr" src="assets/Sparklight_QR_60x60.jpg"
                 alt="QR code to Sparklight Internet">
          </div>
        </footer>
      </article>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
