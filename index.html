<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPPGOnline Builder</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app">
<aside class="db no-print"><h2>Personaville Database</h2><small id="source"></small><input id="search" placeholder="Search persona, rate card, pricing set, modifier..."><div class="filters"><select id="life"><option value="">All lifecycle</option><option>Current</option><option>Scheduled</option></select><select id="pricing"><option value="">All pricing sets</option></select></div><div id="count"></div><div id="rows"></div></aside>
<main><div class="toolbar no-print"><label>Guide <select id="guide"></select></label><button id="exportPdf">Print / Save PDF</button><button id="exportJson">Export Config</button></div>
<article class="sheet"><img id="backdrop" class="backdrop" alt=""><div class="overlay"><section id="plans" class="plans"></section><section id="promoZone" class="promo-zone"><div id="eero" class="eero"><div class="free">FREE</div><div class="ename">eero Plus</div><div class="eterm">for 3 months</div><div class="equal">when you choose a Gig plan.</div></div><div id="mobile" class="mobile">+ Get Unlimited Mobile <b>FREE</b> for 1 Year.</div></section><div id="legal" class="legal"></div></div></article></main>
<aside class="builder no-print"><h2>Template Builder</h2><label>Backdrop<select id="backdropMode"><option value="auto">Auto from database</option><option value="fiberFueled">Fiber-Fueled</option><option value="fiberFueledEquip">Fiber-Fueled + Equipment</option><option value="fiberInternet">Fiber Internet</option><option value="fiberInternetEquip">Fiber Internet + Equipment</option></select></label><label>Plan layout<select id="layout"><option value="auto">Auto</option><option value="2">2 Speeds</option><option value="3">3 Speeds</option><option value="4">4 Speeds</option></select></label><h3>Promo elements</h3><label><input id="teero" type="checkbox"> FREE eero Plus</label><label><input id="tmobile" type="checkbox" checked> Mobile</label><h3>Plan visibility</h3><div id="ptoggles"></div><h3>Export</h3><label>Filename<input id="filename"></label><button id="reset">Use Database Defaults</button><p class="note">Backdrop, plans and legal default from Personaville. Controls are preview/export overrides.</p></aside>
</div><script src="app.js"></script></body></html>
