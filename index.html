<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPPGOnline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace">
    <div class="toolbar no-print">
      <label>Guide <select id="guideSelect"></select></label>
      <button id="printBtn">Print / Save PDF</button>
    </div>

    <article class="sheet" id="sheet">
      <header class="masthead">
        <h1 id="headline">Choose Your<br><span>Fiber-Fueled Speed.</span></h1>
        <img class="top-logo asset" data-asset="logo" alt="Sparklight">
        <div class="reasons" id="reasons">UNLIMITED DATA. NO CONTRACTS. WI-FI POWERED BY EERO.</div>
      </header>

      <section class="content">
        <div class="plans" id="plans"></div>
        <img class="dog asset" data-asset="dog" alt="">
      </section>

      <section class="offers">
        <img id="eeroPromo" class="eero-promo asset" data-asset="eeroPromo" alt="Free eero Plus for 3 months when you choose a Gig plan.">
        <img id="mobilePromo" class="mobile-promo asset" data-asset="mobilePromo" alt="+Get Unlimited Mobile FREE for 1 Year.">
      </section>

      <footer>
        <img class="footer-logo asset" data-asset="logo" alt="Sparklight">
        <div class="contact">Scan, call <strong>1.855.692.4116</strong><br>or visit <strong>Sparklight.com</strong></div>
        <img class="qr asset" data-asset="qr" alt="QR code">
        <div class="legal" id="legal">[APPROVED LEGAL / DISCLAIMER AREA — DATA DRIVEN]</div>
      </footer>
    </article>
  </main>
  <script src="app.js"></script>
</body>
</html>
